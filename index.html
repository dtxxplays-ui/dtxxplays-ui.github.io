<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Pure CSS Animated Anime Purple Night Sky - No External Links */
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f051d 60%, #05020a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Large Animated Glowing Purple Moon/Aura Core */
        .purple-glow-core {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(126, 34, 206, 0.15) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: pulseAura 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseAura {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        /* CSS Real-Time Falling Stars */
        .shooting-star {
            position: absolute;
            top: 0;
            left: 50%;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, #c084fc, transparent);
            filter: drop-shadow(0 0 6px #a855f7);
            transform: rotate(-35deg);
            animation: fall 4s ease-in-out infinite;
            pointer-events: none;
            opacity: 0;
            z-index: 2;
        }

        .shooting-star:nth-child(1) { top: 5%; left: 15%; animation-delay: 0s; }
        .shooting-star:nth-child(2) { top: 12%; left: 65%; animation-delay: 1.5s; }
        .shooting-star:nth-child(3) { top: 25%; left: 35%; animation-delay: 3s; }
        .shooting-star:nth-child(4) { top: 8%; left: 85%; animation-delay: 0.8s; }

        @keyframes fall {
            0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; }
            20% { opacity: 1; }
            60% { transform: translateX(-400px) translateY(400px) rotate(-35deg); opacity: 0; }
            100% { opacity: 0; }
        }

        /* Floating Purple Magic Particles */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #e9d5ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #c084fc, 0 0 15px #a855f7;
            animation: floatParticle 7s infinite linear;
            z-index: 2;
            pointer-events: none;
        }

        .particle:nth-child(5) { left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .particle:nth-child(6) { left: 30%; animation-duration: 6s; animation-delay: 2s; }
        .particle:nth-child(7) { left: 70%; animation-duration: 9s; animation-delay: 1s; }
        .particle:nth-child(8) { left: 90%; animation-duration: 7s; animation-delay: 3s; }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-5vh) scale(1.5); opacity: 0; }
        }

        /* Glassmorphism Profile Card */
        .profile-card {
            position: relative;
            background: rgba(18, 9, 36, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 36px;
            width: 100%;
            max-width: 780px;
            padding: 46px;
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.25), inset 0 0 30px rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            gap: 42px;
            z-index: 10;
        }

        /* Left Side: Avatar */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 4px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
            transition: all 0.4s ease;
        }

        .avatar-box img:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 0 50px rgba(168, 85, 247, 1);
        }

        /* Right Side: Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-header p {
            color: #c084fc;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Skills Section */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.22);
            border: 1px solid rgba(168, 85, 247, 0.45);
            color: #f3e8ff;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(168, 85, 247, 0.45);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        /* Wave Ripple Social Buttons */
        .socials-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f1f5f9;
            padding: 12px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            z-index: 1;
            transition: color 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, #a855f7 0%, #7e22ce 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease-out, height 0.5s ease-out;
            z-index: -1;
        }

        .social-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .social-btn:hover {
            color: #ffffff;
            border-color: #c084fc;
            transform: translateY(-4px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        /* Mobile View Responsive */
        @media (max-width: 650px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
                gap: 28px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Background Animated Layers -->
    <div class="purple-glow-core"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="profile-card">
        <!-- Left Side: Avatar -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <!-- Header -->
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/channels/@me" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
