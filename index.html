<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Full Animated Night Sky + Car Background */
        body {
            min-height: 100vh;
            background: 
                linear-gradient(to bottom, rgba(5, 3, 15, 0.82), rgba(12, 5, 28, 0.88)),
                url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Falling Shooting Stars Animation */
        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            height: 2px;
            background: linear-gradient(-45deg, #a855f7, rgba(0, 0, 255, 0));
            filter: drop-shadow(0 0 6px #c084fc);
            animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite;
            border-radius: 999px;
            pointer-events: none;
        }

        .star::before {
            content: '';
            position: absolute;
            top: calc(50% - 1px);
            right: 0;
            height: 2px;
            background: linear-gradient(-45deg, rgba(0, 0, 255, 0), #ffffff, rgba(0, 0, 255, 0));
            transform: translateX(50%) rotateZ(45deg);
            border-radius: 100%;
            animation: shining 3s ease-in-out infinite;
        }

        .star:nth-child(1) { top: calc(10% - 50px); left: calc(30% - 200px); animation-delay: 0s; }
        .star:nth-child(2) { top: calc(20% - 50px); left: calc(70% - 200px); animation-delay: 1.2s; }
        .star:nth-child(3) { top: calc(35% - 50px); left: calc(50% - 200px); animation-delay: 2.5s; }
        .star:nth-child(4) { top: calc(15% - 50px); left: calc(85% - 200px); animation-delay: 0.8s; }

        @keyframes tail {
            0% { width: 0; }
            30% { width: 100px; }
            100% { width: 0; }
        }

        @keyframes shooting {
            0% { transform: translateX(0) translateY(0) rotate(-35deg); }
            100% { transform: translateX(600px) translateY(400px) rotate(-35deg); }
        }

        /* Glassmorphism Profile Card (Horizontal) */
        .profile-card {
            background: rgba(15, 8, 28, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            width: 100%;
            max-width: 620px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(168, 85, 247, 0.18);
            display: flex;
            align-items: center;
            gap: 30px;
            z-index: 10;
        }

        /* Left Side: Bigger DP */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }

        /* Right Side: Clean Info Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-header p {
            color: #c084fc;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Skills Section */
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.18);
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: #e9d5ff;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Socials Buttons Section */
        .socials-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #a855f7;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* Mobile View Responsive */
        @media (max-width: 550px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 24px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Shooting Stars Layer -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <div class="profile-card">
        <!-- Left Side: Bigger DP -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <!-- Header -->
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/users/dtx_plays" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
