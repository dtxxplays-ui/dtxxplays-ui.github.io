<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark Minecraft Night Sky Background */
        body {
            min-height: 100vh;
            background: linear-gradient(to bottom, #05020c 0%, #0d061f 60%, #15092b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Real-time Falling Shooting Stars (CSS Animated) */
        .star {
            position: absolute;
            top: 20%;
            left: 50%;
            height: 2px;
            background: linear-gradient(-45deg, #c084fc, rgba(0, 0, 255, 0));
            filter: drop-shadow(0 0 6px #a855f7);
            animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite;
            border-radius: 999px;
            pointer-events: none;
        }

        .star::before {
            content: '';
            position: absolute;
            top: calc(50% - 1px);
            right: 0;
            height: 2px;
            background: linear-gradient(-45deg, rgba(0, 0, 255, 0), #ffffff, rgba(0, 0, 255, 0));
            transform: translateX(50%) rotateZ(45deg);
            border-radius: 100%;
        }

        .star:nth-child(1) { top: 5%; left: 20%; animation-delay: 0s; }
        .star:nth-child(2) { top: 15%; left: 60%; animation-delay: 1.2s; }
        .star:nth-child(3) { top: 25%; left: 40%; animation-delay: 2.4s; }
        .star:nth-child(4) { top: 10%; left: 80%; animation-delay: 0.8s; }
        .star:nth-child(5) { top: 35%; left: 10%; animation-delay: 1.8s; }

        @keyframes tail {
            0% { width: 0; }
            30% { width: 120px; }
            100% { width: 0; }
        }

        @keyframes shooting {
            0% { transform: translateX(0) translateY(0) rotate(-35deg); }
            100% { transform: translateX(700px) translateY(450px) rotate(-35deg); }
        }

        /* Profile Card - Glassmorphism */
        .profile-card {
            position: relative;
            background: rgba(18, 9, 36, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 36px;
            width: 100%;
            max-width: 780px;
            padding: 46px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            gap: 42px;
            z-index: 10;
        }

        /* Left Side: Avatar */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 4px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
            transition: transform 0.4s ease;
        }

        .avatar-box img:hover {
            transform: scale(1.04);
        }

        /* Right Side: Info Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-header p {
            color: #c084fc;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Skills Tags */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.22);
            border: 1px solid rgba(168, 85, 247, 0.45);
            color: #f3e8ff;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* Social Buttons with Wave Effect */
        .socials-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f1f5f9;
            padding: 12px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            z-index: 1;
            transition: color 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
        }

        /* Wave Ripple Animation */
        .social-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, #a855f7 0%, #7e22ce 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease-out, height 0.5s ease-out;
            z-index: -1;
        }

        .social-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .social-btn:hover {
            color: #ffffff;
            border-color: #c084fc;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        /* Mobile View Responsive */
        @media (max-width: 650px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
                gap: 28px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Falling Stars Animation Layer -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <div class="profile-card">
        <!-- Left Side: DP -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/channels/@me" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
