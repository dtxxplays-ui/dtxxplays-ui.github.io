<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fixed Working Minecraft Night GIF Background */
        body {
            min-height: 100vh;
            background: #090314 url('https://i.postimg.co/63XmFwL5/minecraft-night.gif') no-repeat center center / cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dark Purple Overlay for Aesthetic Look */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 5, 26, 0.45);
            z-index: 1;
        }

        /* Glassmorphism Profile Card */
        .profile-card {
            position: relative;
            background: rgba(18, 9, 36, 0.72);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 36px;
            width: 100%;
            max-width: 780px;
            padding: 46px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.85), inset 0 0 35px rgba(168, 85, 247, 0.25);
            display: flex;
            align-items: center;
            gap: 42px;
            z-index: 10;
        }

        /* Left Side: DP */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 4px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
        }

        /* Right Side: Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-header p {
            color: #c084fc;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Skills Section */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #f3e8ff;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* Socials Buttons Section */
        .socials-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f1f5f9;
            padding: 12px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #a855f7;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        /* Mobile View Responsive */
        @media (max-width: 650px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
                gap: 28px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Left Side: DP -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <!-- Header -->
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/channels/@me" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
