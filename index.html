<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Aesthetic Cosmic Purple Background with Mesh Glow */
        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 50% 20%, rgba(168, 85, 247, 0.25), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(126, 34, 206, 0.2), transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(88, 28, 135, 0.3), transparent 50%),
                #070312;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        /* Bento Card Container */
        .bento-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(168, 85, 247, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Top Social Buttons */
        .top-nav {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-pill:hover {
            background: #a855f7;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        /* Avatar Section */
        .avatar-box {
            position: relative;
            margin-top: 10px;
        }

        .avatar-box img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 3px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.45);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: -10px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* User Info */
        .user-info {
            text-align: center;
        }

        .user-info h2 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .user-info p {
            color: #c084fc;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Skills Badges */
        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .tag {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #e9d5ff;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Bento Grid Box Items */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .bento-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            transition: 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .bento-item:hover {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .bento-item i {
            font-size: 1.5rem;
            color: #c084fc;
        }

        .bento-item span {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .bento-item small {
            font-size: 0.72rem;
            color: #a78bfa;
        }

        /* Bottom Social Bar */
        .social-bar {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .social-bar a {
            color: #94a3b8;
            font-size: 1.3rem;
            transition: 0.3s;
        }

        .social-bar a:hover {
            color: #c084fc;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="bento-card">
        <!-- Top Nav Links -->
        <div class="top-nav">
            <a href="https://discord.com/users/dtx_plays" target="_blank" class="btn-pill" title="Discord: dtx_plays">
                <i class="fa-brands fa-discord"></i> dtx_plays
            </a>
            <a href="https://www.instagram.com/anticringex/" target="_blank" class="btn-pill">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
        </div>

        <!-- Profile Picture & Status Badge -->
        <div class="avatar-box">
            <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile">
            <span class="status-badge">• HT5 Tier</span>
        </div>

        <!-- Name & Handle -->
        <div class="user-info">
            <h2>dtxxplays-ui</h2>
            <p>Minecraft PvPer & Editor</p>
        </div>

        <!-- Skill Badges -->
        <div class="skills-grid">
            <span class="tag">Minecraft PvPer</span>
            <span class="tag">HT5 Tier</span>
            <span class="tag">Typography</span>
            <span class="tag">Lyrical Editing</span>
        </div>

        <!-- Bento Grid Boxes -->
        <div class="bento-grid">
            <div class="bento-item">
                <i class="fa-solid fa-gamepad"></i>
                <span>HT5 PvPer</span>
                <small>UHC Tier</small>
            </div>
            <div class="bento-item">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Typography</span>
                <small>Visual Motion</small>
            </div>
            <div class="bento-item">
                <i class="fa-solid fa-video"></i>
                <span>Lyrical Edits</span>
                <small>2 Yrs Experience</small>
            </div>
            <a href="https://www.youtube.com/@anticringex" target="_blank" class="bento-item">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
                <small>@anticringex</small>
            </a>
        </div>

        <!-- Bottom Social Bar -->
        <div class="social-bar">
            <a href="https://www.youtube.com/@anticringex" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/anticringex/" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://discord.com/users/dtx_plays" target="_blank" title="Discord: dtx_plays"><i class="fa-brands fa-discord"></i></a>
        </div>
    </div>

</body>
</html>
