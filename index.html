<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Smooth Bug-Free Animated Purple Nebula Mesh */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b031a, #1a0836, #090214);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 24px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient Purple Glow Orbs */
        .glow-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.25);
            border-radius: 50%;
            filter: blur(90px);
            animation: floatOrb 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes floatOrb {
            0% { transform: translate(-100px, -100px) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.2); }
        }

        /* Bigger Glassmorphism Profile Card */
        .profile-card {
            position: relative;
            background: rgba(22, 11, 41, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            width: 100%;
            max-width: 720px; /* Bada Size */
            padding: 40px;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            gap: 36px;
            z-index: 10;
        }

        /* Left Side: Bigger DP */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 150px; /* Enhanced Size */
            height: 150px;
            border-radius: 50%;
            border: 3.5px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
        }

        /* Right Side: Clean Info Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-header p {
            color: #c084fc;
            font-size: 1.05rem;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Skills Section */
        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.22);
            border: 1px solid rgba(168, 85, 247, 0.45);
            color: #f3e8ff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
        }

        /* Socials Buttons Section */
        .socials-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            padding: 10px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #a855f7;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        /* Mobile View Responsive */
        @media (max-width: 600px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 28px;
                gap: 24px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Purple Animated Glow Background -->
    <div class="glow-orb"></div>

    <div class="profile-card">
        <!-- Left Side: Bigger DP -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <!-- Header -->
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/channels/@me" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
