<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated Dark Sukuna Purple Domain Background */
        body {
            min-height: 100vh;
            background: #06020e;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Purple Aura Ring Animation */
        .aura-ring {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(88, 28, 135, 0.15) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: rotateAura 10s linear infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rotateAura {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.15) rotate(180deg); opacity: 0.9; }
        }

        /* Floating Motion Particles Layer */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #c084fc;
            border-radius: 50%;
            box-shadow: 0 0 10px #c084fc, 0 0 20px #a855f7;
            animation: floatUp 6s infinite linear;
            z-index: 2;
        }

        .particle:nth-child(1) { left: 15%; animation-duration: 7s; animation-delay: 0s; }
        .particle:nth-child(2) { left: 35%; animation-duration: 5s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 65%; animation-duration: 8s; animation-delay: 1s; }
        .particle:nth-child(4) { left: 85%; animation-duration: 6s; animation-delay: 3s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Glassmorphism Profile Card - Big & Bold Layout */
        .profile-card {
            position: relative;
            background: rgba(15, 6, 31, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 36px;
            width: 100%;
            max-width: 780px;
            padding: 46px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.95), inset 0 0 35px rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            gap: 42px;
            z-index: 10;
        }

        /* Left Side: DP */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 4px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
        }

        /* Right Side: Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-header p {
            color: #c084fc;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Skills Section */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.22);
            border: 1px solid rgba(168, 85, 247, 0.45);
            color: #f3e8ff;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* Socials Buttons Section */
        .socials-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f1f5f9;
            padding: 12px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #a855f7;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        /* Mobile View Responsive */
        @media (max-width: 650px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
                gap: 28px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Motion Background Layers -->
    <div class="aura-ring"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="profile-card">
        <!-- Left Side: DP -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <!-- Header -->
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/channels/@me" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
