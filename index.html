<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dtxxplays-ui | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Pure CSS Dynamic Neon Purple Gaming/Synthwave Background */
        body {
            min-height: 100vh;
            background: #080214;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Nebula Orbs */
        .nebula-glow-1 {
            position: absolute;
            top: -10%;
            left: 15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(126, 34, 206, 0.15) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(80px);
            animation: pulseNebula 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .nebula-glow-2 {
            position: absolute;
            bottom: -10%;
            right: 15%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.4) 0%, rgba(88, 28, 135, 0.2) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(90px);
            animation: pulseNebula 10s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        @keyframes pulseNebula {
            0% { transform: scale(0.85) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.25) translate(30px, -20px); opacity: 1; }
        }

        /* Moving Cyberpunk Neon Grid Floor */
        .grid-floor {
            position: absolute;
            width: 200%;
            height: 100%;
            bottom: -30%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.18) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(65deg);
            animation: moveGrid 12s linear infinite;
            pointer-events: none;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* Floating Glowing Magic Particles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #e9d5ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #c084fc, 0 0 20px #a855f7;
            animation: floatUp 6s ease-in-out infinite;
            pointer-events: none;
        }

        .sparkle:nth-child(1) { left: 12%; animation-duration: 7s; animation-delay: 0s; }
        .sparkle:nth-child(2) { left: 28%; animation-duration: 5s; animation-delay: 2s; }
        .sparkle:nth-child(3) { left: 65%; animation-duration: 8s; animation-delay: 1s; }
        .sparkle:nth-child(4) { left: 82%; animation-duration: 6s; animation-delay: 3s; }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; transform: translateY(50vh) scale(1.2); }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* Floating Profile Card with Original Smooth Animation */
        .profile-card {
            position: relative;
            background: rgba(15, 7, 31, 0.72);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 36px;
            width: 100%;
            max-width: 780px;
            padding: 46px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            gap: 42px;
            z-index: 10;
            animation: cardFloat 6s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(168, 85, 247, 0.2); }
            100% { transform: translateY(-8px); box-shadow: 0 40px 90px rgba(168, 85, 247, 0.35), inset 0 0 35px rgba(168, 85, 247, 0.35); }
        }

        /* Left Side: Animated DP */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 4px solid #a855f7;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
            transition: all 0.4s ease;
        }

        .avatar-box img:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 0 50px rgba(168, 85, 247, 1);
        }

        /* Right Side Details */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .user-header h2 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-header p {
            color: #c084fc;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Skills Section */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.22);
            border: 1px solid rgba(168, 85, 247, 0.45);
            color: #f3e8ff;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(168, 85, 247, 0.45);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        /* ORIGINAL Animated Glowing Social Buttons With Light Shine */
        .socials-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f1f5f9;
            padding: 12px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Restored Light Shine Hover Effect */
        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transition: left 0.5s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            background: #a855f7;
            color: #ffffff;
            border-color: #c084fc;
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.6);
        }

        /* Mobile View Responsive */
        @media (max-width: 650px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
                gap: 28px;
            }
            .skills-grid, .socials-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Background Dynamic Layers -->
    <div class="nebula-glow-1"></div>
    <div class="nebula-glow-2"></div>
    <div class="grid-floor"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="profile-card">
        <!-- Left Side: Avatar -->
        <div class="left-side">
            <div class="avatar-box">
                <img src="https://i.ibb.co/qYKqv7VR/707427181-18152508655428857-4484127178036789216-n.jpg" alt="Profile DP">
            </div>
        </div>

        <!-- Right Side: Details -->
        <div class="right-side">
            <!-- Header -->
            <div class="user-header">
                <h2>dtxxplays-ui</h2>
                <p>Minecraft PvPer & Video Editor</p>
            </div>

            <!-- Skills Section -->
            <div>
                <div class="section-title">Skills</div>
                <div class="skills-grid">
                    <span class="tag">HT5</span>
                    <span class="tag">Typography Editor</span>
                    <span class="tag">Motion Graphics</span>
                    <span class="tag">Minecraft PvPer</span>
                </div>
            </div>

            <!-- Socials Section -->
            <div>
                <div class="section-title">Connect</div>
                <div class="socials-container">
                    <a href="https://discord.com/channels/@me" target="_blank" class="social-btn">
                        <i class="fa-brands fa-discord"></i> dtx_plays
                    </a>
                    <a href="https://www.instagram.com/anticringex/" target="_blank" class="social-btn">
                        <i class="fa-brands fa-instagram"></i> Instagram
                    </a>
                    <a href="https://www.youtube.com/@anticringex" target="_blank" class="social-btn">
                        <i class="fa-brands fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
